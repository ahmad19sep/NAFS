# Native Android app: compile, unit tests, lint, installable debug APK and
# Compose screenshots on every push that touches android/.
#
# Download the APK from the run page → Artifacts → nafs-debug-apk. The debug
# build installs as "NAFS (debug)" next to the release app (id suffix .debug).

name: Android

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch: {}

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;36.0.0'

      # compileSdk 37 can sit outside the default SDK channel; whatever is
      # still missing here, the Android Gradle Plugin downloads itself.
      - name: Android SDK platform 37
        run: |
          sdkmanager --list 2>/dev/null | grep -E "platforms;android-3[67]" || true
          sdkmanager "platforms;android-37.0" || sdkmanager "platforms;android-37" \
            || sdkmanager --channel=1 "platforms;android-37" || true

      - uses: gradle/actions/setup-gradle@v4

      # Runs every JVM unit test; the screenshot test also records its PNGs.
      - name: Unit tests and screenshots
        run: ./gradlew --no-configuration-cache :app:recordRoborazziDebug

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: android/app/build/outputs/roborazzi/*.png
          if-no-files-found: ignore

      # Also kept on a branch per source branch, so they can be fetched with git.
      - name: Publish screenshots to a branch
        if: always() && github.event_name == 'push' && hashFiles('android/app/build/outputs/roborazzi/*.png') != ''
        working-directory: android/app/build/outputs/roborazzi
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'Source: %s@%s\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" > SOURCE.txt
          git add -A
          git commit -qm "Screenshots for $GITHUB_REF_NAME@${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/screenshots/${GITHUB_REF_NAME}"

      - name: Debug APK
        run: ./gradlew --no-configuration-cache :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nafs-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - name: Lint
        run: ./gradlew --no-configuration-cache :app:lintDebug

      # Unsigned release build: proves R8 shrinking still works before a signed build is made locally.
      - name: Release build (R8)
        run: ./gradlew --no-configuration-cache :app:assembleRelease

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            android/app/build/reports
            android/app/build/test-results
          if-no-files-found: ignore
